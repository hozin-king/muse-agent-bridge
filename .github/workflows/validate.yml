name: Validate collaboration files

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile collaboration tool
        run: python -m py_compile tools/collab.py

      - name: Validate board and registry
        run: python tools/collab.py validate
